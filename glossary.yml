# General statistical stuff
point-estimate: |
  The central tendency estimated by an effect size estimator. This is often returned as `yi` and is what is analyzed as a response variable in meta-analytic models.
  
sampling-variance: |
  The variance around the point estimate. This is the second component of each effect size in a meta-analysis.
  
unit-of-replication: |
  The sampling unit. This is often number of individuals, plots, or sites.
  
overdispersion: |
  Whether a statistical distribution is overdispersed relative to the normal distribution. Overdispersed data is common for count and abundance data.
  
heteroscedasticity: |
  Whether the variance is stable between groups or across a predictor variable.
  
heteroscedastic: |
  Whether the variance is stable between groups or across a predictor variable.

central-tendency: |
  Blah blah blah
  
estimate: |
  An estimate of a *true* effect generated by a function. When you calculate the point estimate and sampling variance of an effect size, you are calculating an *estimate*
  
estimator: |
  The method used (e.g., formula) to calculate an *estimate*. These methods attempt to approximate a truth, which is defined by the *estimand* of an effect size.
  
estimand: |
  The truth that an effect size is attempting to convey. These are often impossible to convey without bias and thus various *estimators* have been developed to reduce bias across different scenarios.

