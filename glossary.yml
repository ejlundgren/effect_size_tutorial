# The effect sizes:
lnRoM: |
  Log-transformed ratio of means, also known as response ratio (lnRR).
  
SMD: |
  Standardized Mean Difference, which is estimated by Cohen's d and Hedges' g among other estimators.
  
Zr: |
  r-to-z-transformed correlation coefficient

