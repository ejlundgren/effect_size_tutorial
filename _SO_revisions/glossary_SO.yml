# General statistical stuff
point-estimate: |
  The single best-guess value of an effect size for one comparison (e.g., one SMD). `escalc` returns it as `yi`, and it is the response variable in meta-analytic models.
  
sampling-variance: |
  How uncertain a point estimate is: roughly, how much it would vary if the study were repeated. `escalc` returns it as `vi`. Together with the point estimate, it is one of the two parts of every effect size, and it sets how much weight each effect size gets.
  
"sampling variance": |
  How uncertain a point estimate is: roughly, how much it would vary if the study were repeated. `escalc` returns it as `vi`. Together with the point estimate, it is one of the two parts of every effect size, and it sets how much weight each effect size gets.
  
unit-of-replication: |
  The independent unit that was replicated and counted in the sample size, such as individuals, plots, or sites.
  
"unit of replication": |
  The independent unit that was replicated and counted in the sample size, such as individuals, plots, or sites.
  
overdispersion: |
  More spread in the data than a count (Poisson) or binomial model would predict; common in abundance data. Some meta-analysis guides also use the word loosely for a large coefficient of variation; in this tutorial we call that problem 'a mean too close to zero'.
  
heteroscedasticity: |
  Unequal variance between groups, or variance that changes along a predictor.
  
heteroscedastic: |
  Unequal variance between groups, or variance that changes along a predictor.

central-tendency: |
  A single number that summarizes the middle of a set of values, such as the mean or median.
  
estimate: |
  Your best guess of the *true* effect, calculated from the data with an *estimator*. When you calculate the point estimate and sampling variance of an effect size, you are calculating an *estimate*.
  
estimator: |
  The method used (e.g., formula) to calculate an *estimate*. These methods attempt to approximate a truth, which is defined by the *estimand* of an effect size.
  
estimand: |
  The true quantity you want to learn about, set by your biological question (e.g., the true relative difference between two group means). It can't be measured perfectly, so different *estimators* have been developed to get as close as possible, with as little bias as possible, in different situations.

bias: |
  How far, on average, an estimator's answers fall from the true value it is trying to estimate.
  
"standard error": |
  How much an estimate (such as a mean) would vary across repeated samples; it shrinks as sample size grows.
  
"standard deviation": |
  The dispersion of a dataset around its mean.
  
# The effect sizes:
lnRoM: |
  Log-transformed ratio of means, also known as the log response ratio.
  
SMD: |
  Standardized Mean Difference, which is estimated by Cohen's d and Hedges' g among other estimators.
  
Zr: |
  Fisher's z-transformed correlation coefficient: Pearson's r put on a scale where its sampling variance depends only on sample size (1/(n − 3)).

lnOR: |
  Log odds ratio: the log of the odds of an event in group 1 divided by the odds of the event in group 2.
  
lnRR: |
  Log risk ratio: the log of the risk (probability) of an event in group 1 divided by the risk in group 2, for binary outcomes.
  
lnCVR: |
  Log coefficient-of-variation ratio: the log of the coefficient of variation (SD divided by mean) in group 1 divided by that in group 2.
  
lnVR: |
  Log variability ratio: the log of the standard deviation in group 1 divided by the standard deviation in group 2.

lnM: |
  Log magnitude: the log of the ratio between the spread *between* two groups and the spread *within* them. It measures how different two groups are, ignoring which one is higher.

# Terms used in meta-analysis
moderator: |
  A study-level or group-level variable (such as habitat or latitude) that may change the size of an effect. Testing a moderator asks whether effects differ across levels of that variable.
  
meta-regression: |
  A regression model in which the effect sizes are the response and moderators are the predictors.
  
"random effect": |
  A term that lets each study have its own true effect, which varies around an overall average, instead of assuming every study shares one true effect.
  
heterogeneity: |
  Variation in the true effects across studies, beyond what sampling error alone would produce.
  
"tau^2": |
  The estimated variance of the true effects across studies (the between-study variance) in a random-effects model.
  
SAFE: |
  A simulation (bootstrap-style) method for estimating an effect size and its uncertainty from summary statistics, used when the usual formulas are not reliable.
  
"delta method": |
  A standard approximation that estimates the variance of a function of estimates (such as a log ratio) from the variances of the original estimates.
  
"continuity correction": |
  A small adjustment, such as adding 0.5 to every cell of a 2x2 table with a zero count, so that the calculation can run.
  
pseudoreplication: |
  Treating non-independent measurements (such as several samples from the same plot) as if they were separate replicates. This makes the sample size look bigger than it is.
  
second-order: |
  A formula that keeps the extra correction terms beyond the simplest (first-order) approximation. It is more accurate, especially for small samples.
  

